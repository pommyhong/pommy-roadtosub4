<style>
*{box-sizing:border-box;margin:0;padding:0}
/* ===== design tokens ===== */
:root{
 --gap-section:24px; --gap-card:16px; --pad-card:16px; --radius:16px; --radius-sm:12px;
 --ink:#1c1c1c; --ink-2:#3e3b35; --muted:#555551; --faint:#706960;
 --line:#e6e2d8; --bg:#f0f0f0; --card:#fff;
 --red:#e63012; --green:#2faa72; --gold:#b07700; --blue:#2d5bff;
 /* type scale */
 --fs-eyebrow:10px; --fs-cap:12px; --fs-body:14px; --fs-h3:16px; --fs-num:22px; --fs-hero:40px;
}
body{background:var(--bg);font-family:'Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;position:relative;-webkit-font-smoothing:antialiased}
.app{max-width:960px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(80px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px));overflow-x:hidden}
/* ===== motion layer · purpose-driven (reward / rhythm / attention) · gated ===== */
.reveal{opacity:0;transform:translateY(12px);will-change:opacity,transform}
.reveal.in{opacity:1;transform:none;transition:opacity .5s ease,transform .55s cubic-bezier(.22,1,.36,1)}
@media(prefers-reduced-motion:reduce){.reveal,.reveal.in{opacity:1!important;transform:none!important;transition:none!important}}
/* Tier 3 — hover lift การ์ด stat/prog (decorative) */
.stat,.prog{transition:transform .18s ease,box-shadow .18s ease}
.stat:hover,.prog:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.06)}
/* Tier 3 — shimmer บน progress bar (สว่างวิ่งผ่านบางๆ) */
.progress-fill{position:relative;overflow:hidden}
.progress-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.4) 50%,transparent 65%);transform:translateX(-120%);animation:pf-shim 3s ease-in-out 1.2s infinite}
@keyframes pf-shim{0%{transform:translateX(-120%)}55%,100%{transform:translateX(220%)}}
@media(prefers-reduced-motion:reduce){.stat:hover,.prog:hover{transform:none!important}.progress-fill::after{display:none!important}}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px;border-bottom:1px solid #e3e0d7;gap:12px;flex-wrap:wrap}
.logo{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.logo span{color:#e63012}
.btn{font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:7px 14px;border-radius:3px;border:1px solid;cursor:pointer;transition:all .15s;background:none}
.btn-outline{border-color:#cfccc2;color:#6b6b6b}.btn-outline:hover{border-color:#9a968a;color:#1c1c1c}
.btn-gold{border-color:#d6920a;color:#b07700}.btn-gold:hover{background:#f5a62318}
.banner{background:#fdf6e3;border:1px solid #f0d89a;border-radius:3px;padding:10px 14px;margin-top:14px;font-size:11px;color:#9a6b00;line-height:1.5}
.race-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.race{background:#fff;border:1px solid #e3e0d7;border-radius:3px;padding:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.race.next{border-color:#e63012}
.race-label{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.race-name{font-size:13px;font-weight:600;color:#1c1c1c;line-height:1.3}
.race-meta{font-size:10px;color:#6b6b6b;margin-top:2px}
.prog-bar{display:grid;grid-template-columns:repeat(4,1fr);margin-top:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ps{padding:var(--s-3) var(--s-1)}
.ps+.ps{border-left:1px solid var(--line);padding-left:var(--s-3)}
.ps-n{font-family:var(--font-display);font-size:var(--fs-num-s);font-weight:700;line-height:1;letter-spacing:-.01em;color:#1c1c1c}
.ps-n small{font-family:'Google Sans',sans-serif;font-size:var(--fs-label);color:var(--muted);font-weight:700}
.ps-n .arw{font-family:'Google Sans',sans-serif;font-size:14px;margin-left:2px}
.ps-k{font-size:var(--fs-label);font-weight:700;letter-spacing:.04em;white-space:nowrap;text-transform:uppercase;color:var(--muted);margin-top:var(--s-2)}
/* 4 ไทล์ที่จอแคบ: ช่องเหลือ ~86px · label เป็น nowrap uppercase เลยต้องบีบ ไม่งั้นล้น */
@media(max-width:640px){.prog-bar .ps{padding-left:6px;padding-right:0}.prog-bar .ps+.ps{padding-left:6px}.prog-bar .ps-k{font-size:10px;letter-spacing:0}.prog-bar .ps-n{font-size:18px}}/* จอแคบมาก (SE/มือถือเล็ก): ช่องเหลือ ~72px — ลดอีกขั้นกัน label ล้น */
@media(max-width:380px){.prog-bar .ps-k{font-size:9px}.prog-bar .ps-n{font-size:17px}}
.prog{background:#fff;border:1px solid #e3e0d7;border-radius:3px;padding:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.prog.ef{border-color:#bfdcf3}
.prog-l{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.prog-v{font-size:20px;font-weight:700;line-height:1}
.prog-v .arw{font-size:11px;margin-left:4px}
.prog-u{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4}
.day-log{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap;padding-top:8px;border-top:1px dashed #ddd9cf;font-size:11px;color:#444;font-weight:600}
.day-log .la{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.day-log .tm{color:var(--muted);font-weight:500}
.day-log .ef{margin-left:auto;font-size:10px;font-weight:700;color:#3a86c8;background:#e8f2fb;border:1px solid #bfdcf3;border-radius:2px;padding:3px 7px}
.s-chip{display:inline-block;font-size:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:2px;margin-bottom:4px}
.s-res .tm{color:var(--muted)}
.s-ef{display:inline-block;font-size:10px;font-weight:700;color:#3a86c8;background:#e8f2fb;border:1px solid #bfdcf3;border-radius:2px;padding:1px 5px;margin-left:5px}
.dist-chart{position:relative;display:flex;align-items:stretch;gap:6px;height:120px;padding:10px 6px 6px;border:1px solid #e3e0d7;border-radius:4px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.03);overflow:visible}
.dc-track{position:relative}
.dc-ghost{position:absolute;left:0;right:0;bottom:0;background:repeating-linear-gradient(45deg,#e8e5dd,#e8e5dd 4px,#f1efe9 4px,#f1efe9 8px);border-radius:3px 3px 0 0;min-height:2px}
.dc-bar{position:relative}
.chart-legend{display:flex;gap:16px;justify-content:center;font-size:10px;font-weight:600;color:var(--muted);margin-top:8px;margin-bottom:8px}
.chart-legend span{display:inline-flex;align-items:center;gap:5px}
.chart-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;font-style:normal}
.lg-ghost{background:repeating-linear-gradient(45deg,#e8e5dd,#e8e5dd 3px,#f1efe9 3px,#f1efe9 6px)}
.lg-actual{background:#52c896}
.dc-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.dc-km{font-size:10px;font-weight:700;color:#555;min-height:11px}
.dc-track{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.dc-bar{width:100%;max-width:30px;border-radius:3px 3px 0 0;min-height:2px;transition:height .3s}
.dc-d{font-size:10px;color:var(--muted)}
.week-nav{display:flex;align-items:center;gap:0;overflow-x:auto;padding:16px 0 0;border-bottom:1px solid #e3e0d7;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.week-nav::-webkit-scrollbar{display:none}
.wk-btn{font-family:inherit;font-size:var(--fs-label);font-weight:600;padding:8px 10px;background:none;border:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:all .12s;letter-spacing:.06em}
.wk-btn:hover{color:#1c1c1c}
.wk-btn.active{color:#1c1c1c;border-bottom-color:#e63012}
.wk-btn.current{color:#b07700}
.wk-btn{position:relative}
.wk-dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#2faa72}
.wk-btn.active .wk-dot{background:#fff}
.week-hero{padding:20px 0 18px;border-bottom:1px solid var(--line)}
.week-hero-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.week-hero-l{flex:1;min-width:240px}
.week-eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.week-eyebrow .we-w{color:var(--red);font-size:13px}
.week-focus{font-size:19px;font-weight:700;line-height:1.3;color:var(--ink)}
.week-dates{font-size:12px;color:var(--muted);margin-top:5px;font-weight:400}
/* monthly mileage prog tile (in top stats grid) */
.prog-month-row{display:flex;align-items:center;gap:10px;margin-top:6px}
.prog-month-ring{position:relative;width:42px;height:42px;flex-shrink:0}
.prog-month-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.prog-month-r{flex:1;min-width:0}
/* (legacy) monthly mileage tile — เก็บ CSS ไว้เผื่อใช้ที่อื่น */
.month-tile{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:230px}
.month-ring{position:relative;width:54px;height:54px;flex-shrink:0}
.month-ring svg{transform:rotate(-90deg)}
.month-ring-bg{stroke:#f1efe9;fill:none;stroke-width:6}
.month-ring-fill{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.22,1,.36,1)}
.month-ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.month-r{flex:1;min-width:0}
.month-l{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.month-v{font-size:16px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.month-v span{font-size:11px;color:var(--muted);font-weight:600}
.month-u{font-size:10px;color:var(--muted);margin-top:2px}
.month-u b{font-weight:700}
/* weights routine list */
.weights-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:8px}
.weights-grp{margin-top:14px}
.weights-grp:first-child{margin-top:0}
.weights-grp-l{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px;display:flex;align-items:center;gap:10px}
.weights-grp-l::after{content:'';flex:1;height:1px;background:var(--line)}
.weights-row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;color:var(--ink-2)}
.weights-row b{font-weight:600;color:var(--ink)}
.weights-row span{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.weights-note{font-size:11px;color:var(--muted);margin-top:14px;padding-top:10px;border-top:1px dashed var(--line);line-height:1.55}
.phase-banner{display:flex;gap:3px;margin:16px 0}
.ph-seg{flex:1;height:5px;border-radius:2px;min-width:3px}
.week-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:16px 0 24px}
.stat{background:#fff;border:1px solid #e3e0d7;border-radius:3px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.stat-l{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.stat-v{font-size:22px;font-weight:700;line-height:1}
.stat-u{font-size:10px;color:var(--muted);margin-top:2px}
.load-bar{display:flex;align-items:center;gap:8px}
.load-bar .track{flex:1;height:6px;background:#ece9e1;border-radius:3px;overflow:hidden}
.load-bar .fill{height:100%;border-radius:3px;transition:width .4s}
.load-bar .num{font-size:11px;font-weight:700;width:28px;text-align:right}
.progress{background:#fff;border:1px solid #e3e0d7;border-radius:3px;padding:12px 16px;margin-top:8px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.progress-top{display:flex;justify-content:space-between;margin-bottom:6px}
.progress-l{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.progress-v{font-size:11px;font-weight:700}
.progress-track{height:8px;background:#ece9e1;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .4s}
.section-l{font-size:var(--fs-label);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line);margin-top:24px}
.days{display:grid;grid-template-columns:1fr;gap:10px}
.day{background:#fff;border:1px solid #e7e4db;border-radius:4px;padding:14px 16px;position:relative;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.day.today{background:#fdece9;border-color:#e63012}
.day.rest{background:#f1efe9;border-color:#e7e4db;opacity:.75;box-shadow:none}
.day.done{background:#eef8f2;border-color:#52c896}
.day.done.q{background:#e3f4ea}
.day-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.day-date{font-size:10px;font-weight:700;padding:2px 6px;border-radius:2px;letter-spacing:.08em;border:1px solid}
.day-type{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.today-tag{margin-left:auto;background:#e63012;color:#fff;font-size:8px;font-weight:700;letter-spacing:.1em;padding:2px 6px;border-radius:2px}
.day-title{font-size:14px;font-weight:600;color:#1c1c1c;line-height:1.3;margin-bottom:4px}
.day.done .day-title{text-decoration:line-through;text-decoration-color:#52c89680;color:#2faa72}
.day-desc{font-size:12px;color:#6b6b6b;line-height:1.6;margin-bottom:8px}
.day-alt{font-size:11px;color:#9a6b00;background:#fdf6e3;border:1px solid #f0d89a;border-radius:2px;padding:5px 8px;line-height:1.5;margin-bottom:8px}
.day-meta{display:flex;gap:10px;font-size:11px;color:#6b6b6b;flex-wrap:wrap}
.day-meta .carb{color:#b07700;margin-left:auto}
.pace-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.pace{background:#fff;border:1px solid #e7e4db;border-radius:3px;padding:7px 12px;display:flex;gap:8px;align-items:center}
.pace .bar{width:3px;height:24px;border-radius:2px}
.pace-l{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.pace-v{font-size:13px;font-weight:700}
.legend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-top:8px}
.legend{background:#fff;border:1px solid #e7e4db;border-radius:3px;padding:8px 10px}
.legend-l{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.legend-v{font-size:13px;font-weight:700;color:#b07700}
.legend-u{font-size:10px;color:var(--muted);margin-top:1px}
/* ===== v2 redesign — radius 16, hero, race timeline, chips, HR chart ===== */
.prog,.stat,.progress,.dist-chart{border-radius:16px}
.prog{padding:16px}
.prog-bar{margin-top:24px}
.pace,.legend{border-radius:12px}
/* hero — dark race-poster style · checkered subtle texture */
.hero{position:relative;overflow:hidden;background:radial-gradient(ellipse at 30% 22%,#22a6d6 0%,#1583b8 45%,#0a5578 100%);border-radius:20px;padding:16px;margin-top:16px;color:#fff;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(45deg,#0e6bbf 25%,transparent 25%,transparent 75%,#0e6bbf 75%),linear-gradient(45deg,#0e6bbf 25%,transparent 25%,transparent 75%,#0e6bbf 75%);background-size:28px 28px;background-position:0 0,14px 14px;opacity:0;pointer-events:none;mask-image:linear-gradient(135deg,#000 0%,#000 35%,transparent 65%);-webkit-mask-image:linear-gradient(135deg,#000 0%,#000 35%,transparent 65%)}
.hero-inner{position:relative;display:flex;align-items:center;column-gap:20px;row-gap:14px;flex-wrap:wrap}
.hero-left{flex:1;min-width:200px}
.hero-right{display:flex;align-items:center;gap:12px;flex-wrap:nowrap}
.hero-eyebrow{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.72);margin-bottom:10px}
.pulse-dot{width:7px;height:7px;border-radius:50%;background:#d4f54a;box-shadow:0 0 0 0 rgba(212,245,74,.5);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(212,245,74,.55)}70%{box-shadow:0 0 0 9px rgba(212,245,74,0)}100%{box-shadow:0 0 0 0 rgba(212,245,74,0)}}
.hero-race{font-size:24px;font-weight:800;line-height:1.15;color:#fff;letter-spacing:-.01em}
.hero-meta{font-size:12px;color:rgba(255,255,255,.72);margin-top:6px;line-height:1.5}
.hero-meta b{color:rgba(255,255,255,.95);font-weight:600}
.hero-countdown{display:flex;align-items:flex-start;gap:10px;font-variant-numeric:tabular-nums}
.cd-block{display:flex;flex-direction:column;align-items:center;min-width:40px}
.cd-num{font-size:32px;font-weight:800;line-height:1;letter-spacing:-.02em;color:#fff}
.cd-unit{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-top:6px;font-weight:600}
.cd-sep{font-size:22px;color:#3a3a3a;font-weight:300;line-height:1;padding-top:3px}
.hero-goal{background:#d4f54a;color:#1a1a1a;padding:9px 14px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;letter-spacing:.01em;box-shadow:0 2px 10px rgba(212,245,74,.25)}
.hero-prog-row{position:relative;display:flex;align-items:center;gap:12px;margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.18)}
.hero-prog-l{font-size:11px;color:rgba(255,255,255,.72);font-weight:600;white-space:nowrap}
.hero-prog-track{flex:1;height:6px;background:rgba(255,255,255,.18);border-radius:8px;overflow:hidden}
.hero-prog-fill{height:100%;background:linear-gradient(90deg,#d4f54a,#9bd027);border-radius:8px;transition:width 1s cubic-bezier(.22,1,.36,1)}
.hero-prog-v{font-size:11px;color:#d4f54a;font-weight:700;min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
/* liquid shimmer fx — WebGL flowing gradient (danield-style) · sibling ถาวร ไม่โดน innerHTML ทับ */
.hero-fx{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;border-radius:inherit}
.hero-gl{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:inherit}
.hero-fx-fallback{background:radial-gradient(ellipse at 30% 25%,#22a6d6 0%,#1583b8 45%,#0a5578 100%)}
#hero-body{position:relative;z-index:1;text-shadow:0 1px 10px rgba(3,18,24,.55),0 1px 3px rgba(3,18,24,.5)}
.hero-goal{text-shadow:none}
/* race timeline — mini pills (others, below hero) */
.race-line{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.rl-item{flex:1;min-width:220px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:14px}
.rl-item.a{background:linear-gradient(135deg,#fff,#fff8f3);border-color:#f0b9a8}
.rl-l{flex:1;min-width:0}
.rl-name{font-size:13px;font-weight:700;color:var(--ink);line-height:1.2;display:flex;align-items:center;gap:6px}
.rl-tag{font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red);background:#fdece9;padding:2px 6px;border-radius:16px}
.rl-meta{font-size:11px;color:var(--muted);margin-top:3px}
.rl-cd{text-align:right;line-height:1;font-variant-numeric:tabular-nums}
.rl-cd-n{font-size:20px;font-weight:800;color:var(--ink)}
.rl-item.done{background:#f7f6f2;border-color:var(--line)}
.rl-done{background:#eaf7f0;color:#2faa72}
.rl-cd-t{font-family:var(--font-display);font-size:var(--fs-num);font-weight:700;line-height:1;letter-spacing:-.01em;color:var(--ink)}
.rl-cd-t.hit{color:#2faa72}
.rl-cd-u{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
/* week-nav as chips · sticky single nav */
.week-nav{border-bottom:none;gap:6px;padding:16px 0 6px}
.chip-label + .week-nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20;padding-top:8px;padding-bottom:8px;margin:0 -4px;padding-left:4px;padding-right:4px}
.wk-btn{border:1px solid #e3e0d7;background:#fff;border-radius:16px;padding:6px 13px;margin-bottom:0;color:var(--muted)}
.wk-btn:hover{border-color:#9a968a;color:#1c1c1c}
.wk-btn.current:not(.active){border-color:#f5a623;color:#b07700}
.wk-btn.active{background:var(--ink);color:#fff;border:1px solid var(--ink)}
/* HR per session chart */
.hr-chart{display:flex;flex-direction:column;gap:9px;background:#fff;border:1px solid #e3e0d7;border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.hr-row{display:flex;align-items:center;gap:10px}
.hr-track{flex:1;height:14px;background:#f1efe9;border-radius:16px;overflow:hidden}
.hr-fill{height:100%;border-radius:16px;transition:width .4s}
.hr-val{width:58px;text-align:right;font-size:12px;font-weight:700;flex-shrink:0}
.hr-val span{font-size:10px;color:var(--muted);font-weight:600}
.hr-grp{display:flex;flex-direction:column;gap:5px}
.hr-grp+.hr-grp{margin-top:5px;padding-top:11px;border-top:1px solid #f1efe9}
.hr-glab{font-size:11px;font-weight:700}
.hr-glab span{font-size:10px;color:var(--muted);font-weight:600}
.hr-k{width:30px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;flex-shrink:0}
/* type chip legend */
.type-legend{display:flex;flex-wrap:wrap;gap:var(--s-2);padding:var(--s-3) 0 var(--s-1);border-top:1px solid var(--line)}
.tl-chip{font-size:var(--fs-micro);font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:var(--s-1) var(--s-2);border-radius:16px}
/* compact reference pills (pace + carb) */
.ref-row{display:flex;flex-wrap:wrap;gap:8px}
.ref-pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #e7e4db;border-radius:16px;padding:6px 12px;font-size:11px;font-weight:600;color:#444;white-space:nowrap}
.ref-pill b{font-weight:700;color:#1c1c1c}
.ref-pill i{color:#706960;font-style:normal;font-size:10px}
.ref-pill-menu{cursor:pointer;transition:border-color .15s,background .15s}
.ref-pill-menu:hover{border-color:#bdb8aa;background:#faf9f5}
.ref-pill-menu.active{border-color:#1c1c1c;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.ref-caret{color:#706960;font-size:9px;margin-left:1px}
.ref-pill-menu.active .ref-caret{transform:rotate(180deg);display:inline-block}
.nutri-wrap{display:flex;flex-direction:column;gap:14px;margin-top:14px}
#nutri-menus{min-width:0}
.nutri-menu{display:none;background:#fff;border:1px solid #e7e4db;border-radius:14px;padding:14px 16px}
.nutri-menu.open{display:block}
.nutri-head{font-size:13px;font-weight:700;margin-bottom:8px}
.nutri-tg{color:#706960;font-weight:400;font-size:11px}
.nutri-note{font-size:11px;color:#b07700;background:#fdf7e8;border-radius:8px;padding:6px 10px;margin-bottom:8px;line-height:1.5}
.nutri-tbl{width:100%;border-collapse:collapse;font-size:12px}
.nutri-tbl th{text-align:left;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#706960;font-weight:700;padding:4px 6px;border-bottom:1px solid var(--line)}
.nutri-tbl td{padding:6px;border-bottom:1px solid #f1efe9;color:#444;vertical-align:top}
.nutri-tbl td:nth-child(n+3){text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;color:#1c1c1c;font-weight:600}
.nutri-sum td{border-top:2px solid var(--line);border-bottom:none;font-weight:700;color:#1c1c1c;padding-top:8px}
.nutri-sum td:first-child{text-align:left}
.nutri-ok{font-size:11px;color:#2f9e6a;font-weight:600;margin-top:8px}
.recovery-block{background:#f3faf6;border:1px solid #cfe9da;border-radius:14px;padding:14px 16px}
.recovery-title{font-size:13px;font-weight:700;margin-bottom:10px;color:#1c1c1c}
.recovery-row{padding:8px 0;border-bottom:1px solid #ddeee4;font-size:12px}
.recovery-row:last-child{border-bottom:none}
.recovery-row b{display:inline-block;color:#1c1c1c}
.recovery-row .rc-goal{display:inline-block;margin-left:8px;color:#2f9e6a;font-weight:600;font-size:11px}
.recovery-row .rc-eat{display:block;color:#555;margin-top:2px;line-height:1.5}
.ref-sub{font-size:11px;font-weight:600;color:var(--ink-2);margin:16px 0 8px}
.ref-sub i{color:var(--faint);font-weight:500;font-style:normal}
.section-l + .ref-sub{margin-top:0}
.ref-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
/* บันทึกผลการซ้อม — card (big date · RPE · badges · note) */
.log-list{display:flex;flex-direction:column;gap:var(--s-2)}
.log-item{display:flex;gap:var(--s-3);background:#fff;border:1px solid var(--line);border-radius:16px;padding:var(--s-3)}
.log-date{flex-shrink:0;text-align:center;line-height:1;min-width:32px}
.log-date .ld-num{display:block;font-family:var(--font-display);font-size:var(--fs-num-s);font-weight:700;color:var(--ink)}
.log-date .ld-mo{display:block;font-size:var(--fs-micro);font-weight:700;color:var(--muted);margin-top:var(--s-1)}
.log-body{flex:1;min-width:0}
.log-head{display:flex;align-items:flex-start;gap:10px}
.log-title{flex:1;font-size:var(--fs-label);font-weight:700;color:var(--ink);line-height:1.3}
.log-tw{font-size:var(--fs-micro);font-weight:600;color:var(--muted)}
.log-rpe{flex-shrink:0;text-align:right;font-family:inherit;font-size:var(--fs-body);font-weight:700;color:var(--muted);line-height:1;letter-spacing:-.01em}
.log-rpe>span{display:block;font-size:var(--fs-micro);font-weight:700;letter-spacing:.1em;color:var(--muted);margin-top:2px;display:flex;align-items:center;justify-content:flex-end;gap:2px}
.log-rpe .tip-i{margin-left:2px}
.log-item .s-chip{display:inline-block;margin:7px 0 0}
.log-badges{display:flex;flex-wrap:wrap;gap:var(--s-1);margin-top:var(--s-2)}
.lb{font-size:var(--fs-label);font-weight:600;padding:2px var(--s-2);border-radius:16px;background:#f1efe9;color:var(--ink-2);white-space:nowrap}
.lb-km{background:#f1efe9;color:var(--ink)}
.ses-split{font-weight:500;opacity:.7;font-size:10px}
.s-multi{display:inline-block;font-size:var(--fs-micro);font-weight:700;color:var(--muted);background:#f1efe9;border-radius:8px;padding:1px var(--s-1);vertical-align:middle;cursor:help}
.lb-pace{background:#f1efe9;color:var(--ink-2)}
.lb-hr{background:#f1efe9;color:var(--ink-2)}
.lb-te{background:#f1efe9;color:var(--ink-2)}
.lb-ef{background:#f1efe9;color:var(--ink-2)}
.lb-tm{background:#fdf6e3;color:#9a6b00}
.lb-warn{background:#fdf6e3;color:#9a6b00;font-size:10px;padding:2px 8px}
.lb-toggle{border:none;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:2px}
.lb-chev{font-size:9px;transition:transform .15s}
.lb-toggle.open .lb-chev{transform:rotate(180deg)}
.lb-more{display:none;gap:6px}
.lb-more.open{display:contents}
.log-note{font-size:var(--fs-label);color:var(--muted);line-height:1.55;margin-top:var(--s-2)}
/* แถบโซน HR ในการ์ดแต่ละวัน — เห็นว่า run นั้นไปตกโซนไหน (เพิ่ม 29/08) */
.hz{margin-top:var(--s-2)}
.hz-track{position:relative;display:flex;height:15px;border-radius:7px;overflow:hidden;background:#eeece6}
.hz-track>span{display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:700;color:#fff;opacity:.32}
.hz-track>span.on{opacity:1}
.hz-wrap{position:relative;padding-top:5px}
.hz-avg{position:absolute;top:0;bottom:-2px;width:2px;background:var(--ink);z-index:3;box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.hz-avg::after{content:'';position:absolute;top:-4px;left:-3.5px;width:9px;height:9px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 1.5px #fff}
.hz-max{position:absolute;top:5px;bottom:0;width:1.5px;background:rgba(28,28,28,.42);z-index:2}
.hz-goal{position:absolute;top:5px;bottom:0;border:1.5px dashed rgba(28,28,28,.5);border-radius:6px;z-index:1;pointer-events:none}
.hz-cap{font-size:var(--fs-label);color:var(--faint);margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.hz-cap b{color:var(--ink);font-weight:700}
.hz-over{color:#d62a0e;font-weight:700}
.hz-in{color:#2faa72;font-weight:700}
.hz-src{font-style:normal;color:var(--faint);font-weight:500}
/* ── เพซ × หัวใจเป้าหมาย (ท่า 1: สเปกตรัมบน + ตารางล่าง · 29/08) ── */
/* การ์ดเดียวครอบทั้ง section — เดิมเป็น 5 ก้อนลอยเรียงกัน ไม่มีอะไรบอกว่าเป็นเรื่องเดียวกัน
   ใช้ pattern เดียวกับ .wkh / .wk-list (ขาว · border --line · radius 16) ให้เข้าชุดกับที่เหลือ */
.pz-card{background:#fff;border:1px solid var(--line);border-radius:16px;
 padding:var(--s-4);margin:var(--s-4) 0 0}
.pz-div{height:1px;background:#f0eee8;margin:13px 0}
/* แถบอากาศ = inset ในการ์ด — พื้นเข้มกว่านิดเดียว ไม่ต้องมี border ซ้อน border ของการ์ด */
.wx{display:flex;align-items:center;justify-content:space-between;gap:12px;
 padding:10px 13px;border-radius:10px;background:#faf9f5}
.wx-l{font-size:11px;font-weight:600;color:var(--ink-2)}
.wx-l s i{font-style:normal;color:#8d867b}
.wx-age{font-size:9px;font-weight:600;color:var(--faint);background:#efece5;
 border-radius:4px;padding:1px 5px;margin-left:2px;white-space:nowrap}
.wx-age.stale{color:#b07700;background:#fbf3e0}
.wx-l s,.wx-r s{display:block;text-decoration:none;font-weight:500;font-size:9.5px;color:var(--faint);margin-top:2px}
.wx-r{text-align:right}
.wx-r b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.wx-r.warn b{color:#b07700}
.wx-n{font-size:10px;color:var(--muted);line-height:1.5;margin-top:7px;padding-left:2px}
.pz-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.pz-head .t{font-size:11px;font-weight:600;color:var(--ink-2)}
.pz-vdot{font-size:10px;font-weight:700;color:#fff;background:var(--ink);
 border-radius:5px;padding:2px 7px;letter-spacing:.2px}
.pz-vdot s{text-decoration:none;font-weight:500;opacity:.72}
.pz-wrap{position:relative;padding-top:7px}
.pz-sp{position:relative;display:flex;height:30px;border-radius:9px;overflow:hidden;background:#eeece6}
.pz-sp>span{display:flex;align-items:center;justify-content:center;font-size:11px;
 font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.22)}
.pz-mk{position:absolute;top:0;bottom:-3px;width:2px;background:var(--ink);z-index:3;
 box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.pz-mk::after{content:'';position:absolute;top:-5px;left:-4px;width:10px;height:10px;
 border-radius:50%;background:var(--ink);box-shadow:0 0 0 1.5px #fff}
.pz-x{display:flex;font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums;margin-top:5px}
.pz-x span{text-align:center}
.pz-key{font-size:10px;color:var(--ink-2);margin-top:8px;line-height:1.5;
 display:flex;align-items:baseline;gap:6px}
.pz-key .dot{width:7px;height:7px;border-radius:50%;background:var(--ink);
 flex-shrink:0;transform:translateY(-1px)}
.pz-key b{color:var(--ink)}
.pz-rows{margin-top:0}
.pz-r{display:grid;grid-template-columns:19px 1fr 84px;align-items:center;gap:10px;
 padding:6px 0;border-bottom:1px solid #f4f2ec}
.pz-r:last-child{border-bottom:0}
.pz-r .k{font-size:12px;font-weight:700}
.pz-r .p{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.pz-r .p s{display:block;font-size:9.5px;color:var(--faint);text-decoration:none;font-weight:400;margin-top:1px}
.pz-r .h{text-align:right}
.pz-r .h b{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;display:block}
.pz-r .h s{font-size:9.5px;color:var(--faint);text-decoration:none}
.log-empty{font-size:12px;color:var(--muted);background:#fff;border:1px dashed #ddd9cf;border-radius:16px;padding:18px;text-align:center}
/* 🎯 Note — Peak-End close + journey context */
.snap-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;box-shadow:0 1px 2px rgba(0,0,0,.03);margin-top:8px}
.snap-lead{font-size:13px;line-height:1.65;color:var(--ink-2);padding-bottom:14px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.snap-lead b{color:var(--ink);font-weight:600}
.snap-lead .phase-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:10px;background:#eaf7f0;color:#2f9e6a;margin:0 2px;vertical-align:1px}
.snap-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px dashed #eceae2;font-size:13px}
.snap-row:last-child{border-bottom:none}
.snap-l{color:var(--ink-2);font-weight:500}
.snap-v{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;font-size:15px}
.snap-v .snap-sub{font-size:11px;font-weight:500;color:var(--muted);margin-left:6px}
/* week selector label */
.chip-label{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:24px;margin-bottom:4px}
.chip-label + .week-nav{padding-top:0}
/* HR daily SVG chart */
.hr-svg-wrap{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 10px 6px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.hr-svg{width:100%;height:auto;display:block;font-family:'Google Sans',sans-serif}
.hr-grid{stroke:#eceae2;stroke-width:1}
.hr-axis{fill:var(--muted);font-size:11px;font-weight:600}
.hr-axis-bold{fill:var(--ink-2);font-size:12px;font-weight:700}
/* HR filter chips */
.hr-tabs{display:flex;gap:6px;margin-bottom:10px}
.hr-tab{font-family:inherit;font-size:11px;font-weight:600;padding:6px 14px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;transition:all .15s}
.hr-tab:hover{border-color:#9a968a;color:var(--ink)}
.hr-tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
/* jargon tooltip — info icon for casual viewers */
.tip{position:relative;display:inline-flex;align-items:center;cursor:help}
.tip-i{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;background:#cfccc2;color:#fff;font-size:9px;font-weight:700;font-style:normal;margin-left:4px;line-height:1;flex-shrink:0}
.tip-i:hover{background:#9a968a}
.tip-body{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);max-width:calc(100vw - 24px);background:#1a1a1a;color:#fff;padding:8px 10px;border-radius:6px;font-size:11px;font-weight:500;line-height:1.5;white-space:normal;width:200px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.18);text-align:left;letter-spacing:0;text-transform:none}
.tip-body::after{content:'';position:absolute;top:100%;left:calc(50% - var(--ax,0px));transform:translateX(-50%);border:5px solid transparent;border-top-color:#1a1a1a}
.tip:hover .tip-body{opacity:1}
.tip-body b{color:#d4f54a;font-weight:600}
/* dist chart tooltip */
.dc-col{position:relative;cursor:pointer}
.dc-tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);max-width:calc(100vw - 24px);white-space:normal;background:#1a1a1a;color:#fff;padding:10px 12px;border-radius:8px;font-size:11px;line-height:1.5;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:10;box-shadow:0 6px 18px rgba(0,0,0,.18);min-width:180px;text-align:left}
.dc-tip::after{content:'';position:absolute;top:100%;left:calc(50% - var(--ax,0px));transform:translateX(-50%);border:5px solid transparent;border-top-color:#1a1a1a}
.dc-col:hover .dc-tip{opacity:1}
.dc-tip-title{font-weight:700;color:#fff;margin-bottom:6px;font-size:12px}
.dc-tip-row{display:flex;justify-content:space-between;gap:12px;color:#cfccc2}
.dc-tip-row b{color:#fff;font-weight:600}
.dc-tip-delta{margin-top:6px;padding-top:6px;border-top:1px solid #2a2a2a;font-size:10px}
.dc-tip-delta.short{color:#f5a623}
.dc-tip-delta.hit{color:#52c896}
.hr-max-tick{stroke:#b9786a;stroke-width:2;stroke-linecap:round}
.hr-leg{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px;font-size:10px;color:var(--ink-2);font-weight:600}
.hr-lg{display:inline-flex;align-items:center;gap:5px}
.hr-lgd{width:9px;height:9px;border-radius:50%}
.hr-lgl{width:14px;height:2px;background:var(--ink);border-radius:2px}
.hr-lgl.max{background:#b9786a;height:2px;width:14px}
/* race timeline polish — connector + hover + next pulse */
.race-line{position:relative}
.rl-item{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 14px;transition:transform .2s,box-shadow .2s}
.rl-item:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.06)}
.rl-item.next{border-color:var(--red);box-shadow:0 0 0 3px rgba(230,48,18,.10)}
.rl-item.next .rl-dot{animation:pulse 1.8s infinite}
@media(max-width:640px){
.week-stats{grid-template-columns:1fr 1fr}

.hero-inner{flex-direction:column;align-items:flex-start;gap:18px}
.cd-num{font-size:34px}
.cd-block{min-width:40px}
.hero-race{font-size:20px}
.race-line{flex-direction:column}

/* ===== UX v2 — 2026-06-21 ===== */
:root{--font-display:'Barlow Condensed',-apple-system,sans-serif;--gap-section:32px}
/* hero: using original dark card CSS */
/* week-progress dots */

/* ── stat hierarchy ── */
/* เดิมกฎนี้ไม่มี media query → !important ทับกฎมือถือ (1fr 1fr) ทำให้ 4 stat เบียดแถวเดียวบนจอ 375
   label ตัดบรรทัด + ตัวเลข carb โดนตัด · จำกัดให้มีผลเฉพาะจอกว้าง */
@media(min-width:641px){.week-stats{grid-template-columns:1.6fr 1fr 1fr 1fr!important}}
.stat:first-child .stat-v{font-size:28px!important;font-family:var(--font-display)!important;letter-spacing:-.02em!important;line-height:1.1!important}
/* ── bar chart taller ── */
.dist-chart{height:132px!important}
/* ── week nav extras ── */
.wk-ellipsis{align-self:center;color:var(--faint);font-size:var(--fs-label);padding:0 3px;user-select:none;letter-spacing:.06em}
.wk-today-btn{font-family:inherit;font-size:var(--fs-label);font-weight:700;padding:5px 10px;background:none;border:1px solid var(--line);border-radius:16px;color:var(--muted);cursor:pointer;margin-left:8px;white-space:nowrap;transition:border-color .15s,color .15s;flex-shrink:0}
.wk-today-btn:hover{border-color:#e63012;color:#e63012}
/* ── last sync ── */
.sync-badge{font-size:10px;color:var(--faint);padding:2px 8px;border:1px solid var(--line);border-radius:10px;margin-left:auto}
/* ── section breathing ── */
.section-l,.sec-h{margin-top:28px!important}
/* ── done week flash ── */
@keyframes done-week-pop{0%{transform:scale(1)}40%{transform:scale(1.015)}100%{transform:scale(1)}}
.week-stats.week-complete{animation:done-week-pop .5s cubic-bezier(.22,1,.36,1) both}
/* ── today row highlight on jump ── */
@keyframes row-hi{0%,100%{background:inherit}30%,70%{background:#fdece9}}
.wk-row.jump-hi{animation:row-hi 1.2s ease}
/* ── pull-to-refresh ── */
#ptr{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted);background:var(--bg);z-index:9999;pointer-events:none}
#ptr.releasing{transition:height .22s cubic-bezier(.22,1,.36,1)}
#ptr .ptr-spin{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--muted);border-radius:50%}
#ptr.loading .ptr-spin{animation:ptrspin .6s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
/* ── 🍚 race-fuel bottom sheet ── */
.fuel-cta{width:100%;display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:linear-gradient(135deg,#fffdf8,#fdf3e0);border:1px solid #f0d89a;border-radius:14px;padding:15px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s ease}
.fuel-cta:hover{transform:translateY(-2px);box-shadow:0 7px 20px rgba(176,119,0,.15)}
.fuel-cta:active{transform:scale(.985)}
.fuel-cta+.fuel-cta{margin-top:10px}
.fuel-cta-ic{font-size:23px;line-height:1;flex:0 0 auto}
.fuel-cta-t{display:block;font-size:13px;font-weight:700;color:#1c1c1c;line-height:1.35}
.fuel-cta-s{display:block;font-size:11px;color:#96854f;margin-top:3px;line-height:1.45}
.fuel-cta-go{margin-left:auto;flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:#f0d89a;color:#8a6b1f;display:flex;align-items:center;justify-content:center;transition:transform .2s cubic-bezier(.22,1,.36,1),background .2s}
.fuel-cta:hover .fuel-cta-go{transform:translateX(3px);background:#e6c87d}
#fuel-back{position:fixed;inset:0;background:rgba(22,20,16,.44);opacity:0;pointer-events:none;transition:opacity .24s ease-out;z-index:9998}
#fuel-back.instant{transition:none}
#fuel-back.on{opacity:1;pointer-events:auto}
/* ปิด: ต้องเลื่อนพ้นจอ + เผื่อความฟุ้งของ box-shadow (34px) ไม่งั้นเหลือเงาดำคาขอบล่างตอนสไลด์ออก */
#fuel-sheet{position:fixed;left:0;right:0;bottom:0;z-index:9999;width:min(100%,640px);margin-inline:auto;background:var(--bg);border-radius:20px 20px 0 0;max-height:88vh;display:flex;flex-direction:column;transform:translateY(calc(100% + 50px));transition:transform .36s cubic-bezier(.22,1,.36,1),visibility 0s linear .36s;box-shadow:0 -10px 34px rgba(0,0,0,.2);visibility:hidden}
/* visibility ต้องหน่วงจนสไลด์จบ ไม่งั้นแผ่นหายวับตั้งแต่เฟรมแรก เหลือแต่ backdrop ค่อยๆ จาง = เงาดำค้าง */
#fuel-sheet.on{transform:translateY(0);visibility:visible;transition:transform .36s cubic-bezier(.22,1,.36,1),visibility 0s}
#fuel-sheet.dragging{transition:none}
.fs-grab{padding:11px 0 7px;display:flex;justify-content:center;touch-action:none;cursor:grab}
.fs-grab i{width:40px;height:4px;border-radius:2px;background:#d5d1c6;display:block}
.fs-head{padding:0 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.fs-title{font-size:15px;font-weight:700;color:#1c1c1c;line-height:1.3}
.fs-sub{font-size:11px;color:var(--muted);margin-top:3px}
.fs-x{margin-left:auto;flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:15px;line-height:1;cursor:pointer;font-family:inherit;transition:background .15s,transform .15s}
.fs-x:hover{background:#f1efe9;transform:rotate(90deg)}
.fs-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 18px calc(28px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.fs-warn{font-size:11px;color:#b07700;background:#fdf7e8;border-radius:8px;padding:7px 10px;line-height:1.5;margin-bottom:14px}
.fs-blk{margin-bottom:16px;opacity:0;transform:translateY(10px)}
#fuel-sheet.shown .fs-blk{opacity:1;transform:none;transition:opacity .4s ease var(--d),transform .4s cubic-bezier(.22,1,.36,1) var(--d)}
.fs-dhead{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.fs-dl{font-size:13px;font-weight:700;color:#1c1c1c}
.fs-dtag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fs-dtg{margin-left:auto;font-size:11px;font-weight:700;color:#b07700}
.fs-tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fs-tbl td{padding:8px 10px;border-bottom:1px solid #f1efe9;font-size:12px;color:#444;line-height:1.5;vertical-align:top}
.fs-tbl tr:last-child td{border-bottom:none}
.fs-tbl td:first-child{white-space:nowrap;font-weight:600;color:#6b6b6b;width:1%}
.fs-tbl td:last-child{white-space:nowrap;text-align:right;font-weight:700;color:#1c1c1c}
.fs-tbl tr.fs-hit td{background:#fdf7e8}
.fs-tbl2 td:last-child{white-space:normal;text-align:left;font-weight:400;color:#444;width:auto}
.fs-list{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 14px}
.fs-list div{font-size:12px;color:#444;padding:7px 0;border-bottom:1px solid #f1efe9;line-height:1.5}
.fs-list div:last-child{border-bottom:none}
.fs-list b{color:#1c1c1c}
.fs-bad{border-color:#f3d3cd;background:#fef7f5}
.fs-bad div{border-bottom-color:#f9e7e3}
.fs-tip{font-size:12px;color:var(--ink-2);line-height:1.6;padding:7px 0}
/* ── บรรทัดเฟสประจำสัปดาห์ (เงียบ · ไม่ใช่การ์ด) ── */
.wph{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap;font-size:var(--fs-label);color:var(--muted)}
.wph-w{font-weight:800;letter-spacing:.06em;color:var(--red)}
.wph-sep{opacity:.6}
.wph-tag{font-size:var(--fs-micro);font-weight:800;letter-spacing:.1em;text-transform:uppercase;border-radius:20px;padding:2px var(--s-2)}
.wph-why{opacity:.9}
.wph-f{font-size:var(--fs-label);font-weight:700;color:var(--ink);margin-top:var(--s-1);line-height:1.45}
/* ── week header — ลำดับ: eyebrow → เลขหลัก → bar → meta ── */
.wkh{margin:var(--s-3) 0 var(--s-4);background:#fff;border:1px solid var(--line);border-radius:16px;padding:var(--s-4)}
.wkh-eye{display:flex;align-items:center;gap:var(--s-2);font-size:var(--fs-label);font-weight:600;color:var(--muted)}
.wkh-tag{font-size:var(--fs-micro);font-weight:800;letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;border-radius:20px;padding:2px var(--s-2);opacity:.85}
.wkh-num{font-family:var(--font-display);font-size:var(--fs-num);font-weight:700;line-height:1;letter-spacing:-.01em;color:#2faa72;margin-top:var(--s-2);display:flex;align-items:baseline;gap:var(--s-2)}
.wkh-plan{font-family:'Google Sans',sans-serif;font-size:var(--fs-body);color:var(--muted);font-weight:700}
.wkh-pct{margin-left:auto;font-family:'Google Sans',sans-serif;font-size:var(--fs-label);font-weight:700;color:var(--muted)}
.wkh-act{font-family:'Google Sans',sans-serif;font-size:var(--fs-label);font-weight:600;color:#2faa72;margin-left:auto}
.wkh-bar{height:8px;border-radius:4px;background:#eeece6;margin-top:var(--s-2);overflow:hidden}
.wkh-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#52c896,#2faa72);transition:width .6s cubic-bezier(.22,1,.36,1)}
.wkh-meta{display:flex;align-items:center;gap:var(--s-1);flex-wrap:wrap;margin-top:var(--s-2);font-size:var(--fs-label);color:var(--muted)}
.wkh-meta b{color:#1c1c1c}
.wkh-dot{margin:0 var(--s-1);color:var(--faint)}
.wkh-q{margin-left:auto;font-weight:700;color:var(--ink-2)}
/* ── chip เลือกสัปดาห์: โชว์ระยะ (เรฟ KGT) ── */
.wk-btn-w{display:block;font-size:var(--fs-micro);letter-spacing:.08em;opacity:.75}
.wk-btn-k{display:block;font-family:inherit;font-size:var(--fs-body);font-weight:700;letter-spacing:0;margin-top:var(--s-1);font-variant-numeric:tabular-nums}
/* ── accordion section (A: ส่วนที่ดูนานๆ ครั้ง พับเก็บ) ── */
.sec-h{width:100%;display:flex;align-items:center;gap:var(--s-2);background:none;border:none;border-bottom:1px solid var(--line);font-family:inherit;cursor:pointer;padding:0 0 var(--s-2);margin:var(--s-6) 0 0;font-size:var(--fs-label);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);text-align:left;-webkit-tap-highlight-color:transparent}
.sec-h:hover{color:#1c1c1c}
.sec-hint{font-size:var(--fs-label);font-weight:600;letter-spacing:.02em;text-transform:none;color:var(--faint)}
.sec-c{margin-left:auto;font-size:var(--fs-label);color:var(--muted);transition:transform .28s cubic-bezier(.22,1,.36,1)}
.sec-h.open .sec-c{transform:rotate(180deg)}
.sec-body{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .34s cubic-bezier(.22,1,.36,1),opacity .24s ease}
.sec-body>.sec-inner{overflow:hidden;min-height:0}
.sec-body.open{grid-template-rows:1fr;opacity:1}
.sec-body.open>.sec-inner{padding-top:12px}
/* ── D: ปุ่มกาง log เก่า ── */
.more-log{width:100%;font-family:inherit;font-size:11px;font-weight:700;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,color .15s}
.more-log:hover{background:#f7f5f0;color:#1c1c1c}
.more-log .sec-c{margin:0}
@media (prefers-reduced-motion:reduce){.sec-body,.sec-c{transition:none}}
:root{
 /* type scale — ทุกค่าหาร 4 ลงตัว (8/12/16/20/24/32) */
 --fs-micro:8px;   /* tag ละติน TODAY/WEEK */
 --fs-label:12px;  /* label · caption · meta */
 --fs-body:16px;   /* ชื่อรายการ · body */
 --fs-num-s:20px;  /* ตัวเลขรอง */
 --fs-num:24px;    /* ตัวเลขหลัก */
 /* spacing scale */
 --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px;
}
/* ── ตารางซ้อมสัปดาห์ (compact rows · แทนตาราง 5 คอลัมน์เดิม) ── */
.wk-list{background:#fff;border:1px solid var(--line);border-radius:16px;padding:var(--s-1) var(--s-4)}
.wk-row{display:flex;gap:var(--s-3);align-items:flex-start;padding:var(--s-2) 0;border-bottom:1px solid #f1efe9}
.wk-row:last-child{border-bottom:none}
.wk-dt{width:32px;flex:0 0 auto;text-align:center}
.wk-dow{font-size:var(--fs-micro);font-weight:700;letter-spacing:.06em;color:var(--muted)}
.wk-day{font-size:var(--fs-body);font-weight:700;color:#1c1c1c;line-height:1.05;letter-spacing:-.01em}
.wk-bar{width:3px;border-radius:2px;align-self:stretch;flex:0 0 auto}
.wk-main{flex:1;min-width:0}
.wk-ti{font-size:var(--fs-label);font-weight:700;color:#1c1c1c;line-height:1.35}
.wk-de{font-size:var(--fs-label);color:var(--muted);margin-top:var(--s-1);line-height:1.5}
.wk-alt{font-size:var(--fs-label);color:#9a6b00;background:#fdf6e3;border:1px solid #f0d89a;border-radius:8px;padding:var(--s-1) var(--s-2);line-height:1.45;margin-top:var(--s-1);display:inline-block}
.wk-res{font-size:var(--fs-label);color:#2faa72;font-weight:600;margin-top:var(--s-1);line-height:1.5}
.wk-plan{flex:0 0 auto;text-align:right;font-size:var(--fs-label);font-weight:700;color:#6b6b6b;white-space:nowrap;line-height:1.5}
.wk-tag{font-size:var(--fs-micro);font-weight:800;letter-spacing:.08em;color:#fff;background:#e63012;border-radius:4px;padding:var(--s-1) var(--s-2);margin-left:var(--s-2);vertical-align:2px}
.wk-ok{color:#2faa72;font-weight:800;margin-left:7px}
.wk-row.today{background:#fdece9;margin:0 calc(var(--s-4)*-1);padding-left:var(--s-4);padding-right:var(--s-4)}
.wk-row.today:first-child{border-radius:13px 13px 0 0;margin-top:-2px;padding-top:13px}
.wk-row.today:last-child{border-radius:0 0 13px 13px;margin-bottom:-2px;padding-bottom:13px}
.wk-row.done .wk-ti{color:#3c3c3c}
.wk-row.rest .wk-ti,.wk-row.rest .wk-day,.wk-row.rest .wk-plan{color:#aaa69a}
.wk-row.rest .wk-dow{color:#c6c2b6}
/* ── 🗓 ปฏิทินเดือน (macro view) ── */
/* km ของเดือนบนหัวปฏิทิน (ย้ายมาจาก tile สถิติบนสุด) */
.mg-km{font-size:var(--fs-label);color:var(--muted);font-variant-numeric:tabular-nums}
.mg-km b{font-size:var(--fs-body);color:#1c1c1c}
.mg-prog{display:flex;align-items:center;gap:10px;margin:-4px 0 12px}
.mg-prog-bar{flex:1;height:3px;border-radius:2px;background:#e8e5dd;overflow:hidden}
.mg-prog-bar i{display:block;height:100%;border-radius:2px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.mg-prog-t{flex:0 0 auto;font-size:var(--fs-label);font-weight:700}

.mg-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mg-mo{font-size:var(--fs-body);font-weight:700;color:#1c1c1c}
.mg-nav{margin-left:auto;display:flex;gap:6px}
.mg-nav button{font-family:inherit;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink-2);font-size:13px;line-height:1;cursor:pointer;transition:background .15s,transform .15s}
.mg-nav button:hover:not(:disabled){background:#f1efe9;transform:scale(1.08)}
.mg-nav button:disabled{opacity:.3;cursor:default}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mg-dow{font-size:var(--fs-micro);font-weight:700;letter-spacing:.06em;color:var(--muted);text-align:center;padding-bottom:2px}
.mg-cell{height:52px;font-size:var(--fs-label);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;font-family:inherit;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mg-cell:disabled{cursor:default}
.mg-c{width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--fs-label);font-weight:700;transition:transform .16s cubic-bezier(.22,1,.36,1)}
.mg-cell:hover:not(:disabled) .mg-c{transform:scale(1.12)}
.mg-cell:active:not(:disabled) .mg-c{transform:scale(.94)}
.mg-out{cursor:default;pointer-events:none}
.mg-out .mg-c{background:#f1efe9;color:#c6c2b6}
.mg-fut .mg-c{color:#fff}
.mg-race .mg-c{color:#fff;box-shadow:0 0 0 2px #fff,0 0 0 4px #e63012}
.mg-done .mg-c{color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.mg-miss .mg-c{background:#fff!important;border:1.5px dashed #d5d1c6;color:#b4b0a4}
.mg-today .mg-c{outline:2px solid #1c1c1c;outline-offset:2px}
.mg-sel .mg-c{outline:2px solid #e63012;outline-offset:2px}
.mg-mark{height:4px;display:flex;gap:3px;align-items:center}
.mg-mark i{width:4px;height:4px;border-radius:50%;background:#9a968a;display:block}

// EF = ความเร็ว (m/min) ÷ HR เฉลี่ย — สูง=ฟิตขึ้น · grade+heat adjusted (elev/temp) ถ้ามี, ไม่มี=raw

// แยกเป็น helper เพราะเดิมแก้ทีละจุดแล้วตกหล่น (marker ใน pace×HR ยังโชว์ 172 แทน 177)
const hrOf=l=>l?Math.round(l.bhr||l.hr||0):0;
const hxOf=l=>l?Math.round(l.bhx||l.hx||0):0;
const EF_GRADE_K=0.0075,EF_GRADE_CAP=0.15,EF_HEAT_BASE=20,EF_HEAT_K=0.5;
function efOf(l){
 if(!(l&&l.km>0&&l.min>0&&l.hr>0))return null;
 const g=Math.min(l.elev>0?l.elev*EF_GRADE_K:0,l.km*EF_GRADE_CAP);
 const h=l.temp!=null?Math.max(0,l.temp-EF_HEAT_BASE)*EF_HEAT_K:0;
 const ah=l.hr-h;
 return ah>0?((l.km+g)*1000/l.min/ah):null;
}

function dcSeries(){

 W.forEach((w,wi)=>w.d.forEach(day=>{

  // "มี dc" = ผ่านเกณฑ์ steady มาแล้วในตัว — /run-log คำนวณ dc ให้เฉพาะ long หรือ
  // steady continuous ≥ 8 กม. เท่านั้น (intervals/quality ที่มี walk recovery ไม่คำนวณให้)
  // เหลือกฎเดียวที่ต้องกรองเอง = ตัด race (max effort คนละสรีรวิทยา ใส่แล้วบิดค่าเทียบ)
  const _t=l.type||day.t;                      // ยึด type ที่ทำจริงก่อน plan (ตรงกับกราฟ HR)
  if(_t==='race')return;
  a.push({v:l.dc,d:fmt(dateOf(wi,day.d)),t:_t});
 }));
 return a;

function efSeries(){const a=[];W.forEach((w,wi)=>w.d.forEach(day=>{
 const l=getLog(wi,day.d);
 if(!l||(l.type||day.t)!=='easy')return;      // ยึด type ที่ทำจริงก่อน plan (ตรงกับกราฟ HR)
 if(l.env==='tm'||l.mix)return;
 if(!efUsable(l))return;                      // ตัด session ที่ EF ไม่มีความหมาย (ดู efUsable)
 const e=efOf(l);if(e)a.push(e)}));return a}
// EF เทียบกันได้เฉพาะ easy run ที่ "ราบ + steady" — เนินสะพาน/ซ้อมบันไดทำให้เพซช้าลงมากโดยไม่ได้แปลว่าฟิตลด
// (11 ส.ค. 3.4 กม. ไต่สะพาน 293 ม. เพซ 9:11 → EF 0.73 ลากกราฟลงทั้งเส้นทั้งที่เป็นคนละประเภทงาน)
const EF_MIN_KM=3, EF_MAX_PACE=8, EF_MAX_GRADE=40;   // km · นาที/กม. · เมตรไต่ต่อ กม.
function efUsable(l){
 if(!(l.km>=EF_MIN_KM&&l.min>0))return false;
 if(l.min/l.km>EF_MAX_PACE)return false;
 if((l.elev||0)/l.km>EF_MAX_GRADE)return false;
 return true;
}
function cumKm(){let s=0;W.forEach((w,wi)=>w.d.forEach(day=>{const l=getLog(wi,day.d);if(l&&l.km>0)s+=l.km}));return s}

function slotOf(date){

 const b=new Date(date);b.setHours(0,0,0,0);

// ผลของ race ที่ผ่านไปแล้ว — ดึงจาก log ของวันนั้นตรงๆ (ไม่ต้องกรอกมือ)
// goal เขียนเป็นภาษาคน ('sub 45 นาที' / 'sub 4 ชั่วโมง') → แปลงเป็นนาทีเพื่อเทียบผลจริง
function goalMinutes(goal){
 const m=String(goal).match(/(\d+(?:\.\d+)?)\s*(นาที|ชั่วโมง|ชม)/);
 if(!m)return null;
 return /ชั่วโมง|ชม/.test(m[2])?parseFloat(m[1])*60:parseFloat(m[1]);
}
function raceResult(r){
 const sl=slotOf(r.date);
 if(!sl)return null;
 const l=getLog(sl.wi,sl.di);
 if(!l||!(l.km>0)||!(l.min>0))return null;
 // วันแข่งมักมี warm-up แยก activity (mix) → ใช้ session ใหญ่สุด = ตัว race เอง ไม่งั้นระยะ/เพซเพี้ยน
 const useB=l.mix&&l.bkm>0&&l.bmin>0;
 const km=useB?l.bkm:l.km, min=useB?l.bmin:l.min;
 const secs=Math.round(min*60);
 const hh=Math.floor(secs/3600),mm=Math.floor((secs%3600)/60),ss=secs%60;
 const p2=n=>String(n).padStart(2,'0');
 const gm=goalMinutes(r.goal);
 return {
  time:(hh?hh+':'+p2(mm):mm)+':'+p2(ss),
  pace:paceFmt(min*60/km),
  km:km,
  hr:hrOf(l),   // mix ก็โชว์ได้แล้ว — bhr = HR ของ run ยาวสุด ไม่ใช่เฉลี่ยรวม warm-up
  hit:gm==null?null:min<=gm
 };
}

// avg HR ต่อประเภท session (ทั้งแผน) — แบบ go-sub42
function hrByType(){
 const acc={easy:[],quality:[],long:[]};
 W.forEach((w,wi)=>w.d.forEach(day=>{if(!acc[day.t])return;const l=getLog(wi,day.d);if(l&&l.hr>0)acc[day.t].push(l)}));
 const out=[];
 for(const k in acc){const a=acc[k];if(!a.length)continue;
  const avg=Math.round(a.reduce((s,l)=>s+hrOf(l),0)/a.length);
  const mx=a.filter(l=>l.hx>0).map(l=>l.hx);
  out.push({t:k,avg,max:mx.length?Math.round(Math.max(...mx)):0,n:a.length});
 }
 return out;
}

  const a=dcs.filter(x=>dcTrack(x)===tr);

 const _hasRun=wi=>W[wi].d.some(day=>{const l=getLog(wi,day.d);return l&&l.km>0});
 // สัปดาห์ที่กำลังเดินอยู่ยังไม่จบ — ยังไม่มี run ไม่ได้แปลว่า streak ขาด

 let _swi=Math.min(cw,W.length-1);
 if(_swi>=0&&!_hasRun(_swi))_swi--;
 for(; _swi>=0; _swi--){ if(_hasRun(_swi))_streak++; else break; }
 // longest single run
 let _long={km:0,w:0};
 W.forEach((ww,wi)=>ww.d.forEach(day=>{const l=getLog(wi,day.d);if(!l)return;const sk=(l.ses&&l.ses.length)?l.ses[0]:l.km;if(sk>_long.km)_long={km:sk,w:ww.w}}));
 // baseline cadence (easy outdoor only)

 const _cadAvg=_cads.length?Math.round(_cads.reduce((a,b)=>a+b,0)/_cads.length):0;
 // phase description for lead text — clamp cw (curWeek คืน -1 ก่อนวันเริ่มแผน)

 let _noteH='';
 _noteH+='<div class="snap-card">';

 if(_streak>0)_noteH+='<div class="snap-row"><span class="snap-l">สัปดาห์ติดต่อกัน</span><span class="snap-v">'+_streak+' weeks 🔥</span></div>';

 if(_cadAvg)_noteH+='<div class="snap-row"><span class="snap-l">Cadence baseline</span><span class="snap-v">'+_cadAvg+' <span class="snap-sub">spm '+(_cadAvg>=170?'✅':'')+'</span></span></div>';

 // อ้างอิง — Pace + Carb รวมใต้ section เดียว แต่คนละแถว

 // ท่าเวทประจำสัปดาห์ — แสดงเฉพาะถ้าสัปดาห์นี้มี weights day
 const hasWeights=w.d.some(day=>day.t==='cross'&&/weight/i.test(day.ti));
 if(hasWeights){

// chip สัปดาห์ที่เลือกให้อยู่กลางแถบเสมอ (เดิมพอเลือกตัวริมจะค้างชิดขอบ อ่านบริบทซ้าย-ขวาไม่ได้)
let chipCentered=false;
function centerChip(){
 requestAnimationFrame(()=>{
  const nav=document.querySelector('.week-nav'),act=nav&&nav.querySelector('.wk-btn.active');
  if(!nav||!act)return;
  // spacer หัว-ท้าย: ให้ chip ตัวแรก/ตัวสุดท้ายเลื่อนมาอยู่กลางได้เหมือนตัวอื่น
  // (ใส่เป็น padding ผ่าน JS ไม่ใช่ CSS คงที่ — จะได้ไม่สร้าง scroll เกินจำเป็นตอนจอกว้างพอ)
  // เดิมใส่ spacer ครึ่งจอหัว-ท้ายเพื่อให้ W1/W30 มาอยู่กลางได้ — พอ chip ครบ 30 ตัว
  // ที่ว่างนั้นกลายเป็นช่องโหวงตอนเลื่อนสุดทาง เลยเหลือ padding ปกติ (W1/W30 ชิดขอบตามมาตรฐาน tab strip)
  nav.style.paddingLeft='';nav.style.paddingRight='';
  const target=act.offsetLeft-(nav.clientWidth-act.offsetWidth)/2;
  const max=nav.scrollWidth-nav.clientWidth;
  const left=Math.max(0,Math.min(target,max));
  nav.scrollLeft=left;   // instant — แถบถูก re-render ทุกครั้ง ถ้า smooth จะเห็นมันไถลจาก 0 ทุกทีที่กด
  chipCentered=true;
 });
}
// หมุนจอ/ย่อขยายหน้าต่าง → คำนวณ spacer + ตำแหน่งกลางใหม่

addEventListener('resize',()=>{clearTimeout(chipRT);chipRT=setTimeout(centerChip,150)});

// ── bottom sheet (ใช้ร่วมทุกการ์ด · เนื้อหามาจาก SHEETS[key].blocks) ──
const sheetCache={};
function buildSheet(key){
 const S=SHEETS[key];if(!S)return;
 document.getElementById('fs-title').innerHTML=S.title;
 document.getElementById('fs-sub').textContent=S.sub;
 if(sheetCache[key]){document.getElementById('fs-body').innerHTML=sheetCache[key];return}
 let h=S.warn?'<div class="fs-warn">'+S.warn+'</div>':'',i=0;
 const blk=(inner)=>{const s='<div class="fs-blk" style="--d:'+(i*45)+'ms">'+inner+'</div>';i++;return s};
 S.blocks.forEach(b=>{
  let t='<div class="fs-dhead"><span class="fs-dl">'+b.l+'</span>'+
   (b.tag?'<span class="fs-dtag">'+b.tag+'</span>':'')+
   (b.tg?'<span class="fs-dtg">'+b.tg+'</span>':'')+'</div>';
  if(b.k==='table'){
   const c3=b.rows.some(r=>r[2]);                                  // 2 คอลัมน์ = ให้ช่องท้ายตัดบรรทัดได้ (ไม่งั้นล้นแนวนอน)
   t+='<table class="fs-tbl'+(c3?'':' fs-tbl2')+'">';
   b.rows.forEach((r,ri)=>{t+='<tr'+(b.hit===ri?' class="fs-hit"':'')+'><td>'+r[0]+'</td><td>'+r[1]+'</td>'+(c3?'<td>'+(r[2]||'')+'</td>':'')+'</tr>'});
   t+='</table>'+(b.foot?'<div class="fs-tip">'+b.foot+'</div>':'');
  }else if(b.k==='list'){
   t+='<div class="fs-list'+(b.bad?' fs-bad':'')+'">'+
    b.rows.map(r=>'<div><b>'+r[0]+'</b> '+(b.sep||'—')+' '+r[1]+'</div>').join('')+'</div>';
  }else{
   t+=b.rows.map(r=>'<div class="fs-tip">'+r+'</div>').join('');
  }
  h+=blk(t);
 });
 sheetCache[key]=h;
 document.getElementById('fs-body').innerHTML=h;
}
function openSheet(key){
 buildSheet(key);
 const s=document.getElementById('fuel-sheet');
 document.getElementById('fs-body').scrollTop=0;
 document.getElementById('fuel-back').classList.add('on');
 s.classList.add('on');s.setAttribute('aria-hidden','false');
 const sbw=window.innerWidth-document.documentElement.clientWidth;   // ล็อกสกรอลล์แล้ว scrollbar หาย → หน้าเด้งกว้างขึ้น · ชดเชยด้วย padding เท่าความกว้าง scrollbar
 document.body.style.overflow='hidden';
 if(sbw>0)document.body.style.paddingRight=sbw+'px';
 requestAnimationFrame(()=>s.classList.add('shown'));
}
function closeFuel(){
 const bk=document.getElementById('fuel-back');
 bk.classList.add('instant');                     // ดับฉากหลังทันที — การเฟดออกคือสิ่งที่เห็นเป็น "เงาค้าง"
 requestAnimationFrame(()=>requestAnimationFrame(()=>bk.classList.remove('instant')));
 const s=document.getElementById('fuel-sheet');
 s.classList.remove('on','shown','dragging');s.style.transform='';
 s.setAttribute('aria-hidden','true');
 document.getElementById('fuel-back').classList.remove('on');
 document.body.style.overflow='';
 document.body.style.paddingRight='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('fuel-sheet').classList.contains('on'))closeFuel()});
// ลากลงเพื่อปิด (native feel บนมือถือ) — ปิดเมื่อลากเกิน 90px หรือสะบัดเร็ว
(function(){
 const g=document.getElementById('fs-grab'),s=document.getElementById('fuel-sheet');
 if(!g)return;
 let y0=0,t0=0,dy=0,on=false;
 g.addEventListener('pointerdown',e=>{on=true;y0=e.clientY;t0=performance.now();dy=0;s.classList.add('dragging');g.setPointerCapture(e.pointerId)});
 g.addEventListener('pointermove',e=>{if(!on)return;dy=Math.max(0,e.clientY-y0);s.style.transform='translateY('+dy+'px)'});
 g.addEventListener('pointerup',e=>{
  if(!on)return;on=false;s.classList.remove('dragging');
  const v=dy/Math.max(1,performance.now()-t0);
  if(dy>90||v>.6)closeFuel();     // closeFuel เคลียร์ inline transform เอง — เคลียร์ก่อนจะเด้งกลับ 0 แล้วค่อยไหลลง (กระตุก)
  else s.style.transform='';      // ไม่ถึง threshold = สปริงกลับ (transition กลับมาแล้วเพราะถอด .dragging ไปก่อนหน้า)
 });
 g.addEventListener('pointercancel',()=>{on=false;s.classList.remove('dragging');s.style.transform=''});
})();

// motion layer — แต่ละ effect ผูกกับหน้าที่ (ไม่ใช่ขยับเปล่า)
function initMotion(){
 if(motionDone)return;                                            // เล่นรอบแรกรอบเดียว
 motionDone=true;
 if(matchMedia('(prefers-reduced-motion:reduce)').matches)return; // เคารพ accessibility
 const EASE='cubic-bezier(.22,1,.36,1)';
 const revealEls=[],vizJobs=[];

 // ── observer เดียว: reveal (fade-rise) + viz (callback) ──
 const io=new IntersectionObserver((ents,obs)=>{ents.forEach(en=>{
  if(!en.isIntersecting)return;
  const el=en.target;
  if(el.__viz){el.__viz();}
  else{el.style.transitionDelay=(el.dataset.d||0)+'ms';el.classList.add('in');}
  obs.unobserve(el);
 })},{threshold:.12,rootMargin:'0px 0px -8% 0px'});
 function viz(sel,fn){const el=document.querySelector(sel);if(!el)return;el.__viz=fn;vizJobs.push(fn);io.observe(el);}

 // ── Tier 2: count-up เลขนำหน้า (เก็บ suffix/span ไว้) · auto decimals · ข้ามถ้า hidden ──
 function cu(el,dur){
  if(!el||document.hidden)return;
  let tn=null;for(const n of el.childNodes){if(n.nodeType===3&&/\d/.test(n.nodeValue)){tn=n;break;}}
  if(!tn)return;
  const m=tn.nodeValue.match(/^([\d,]+(?:\.\d+)?)([\s\S]*)$/);if(!m)return;
  const dec=(m[1].split('.')[1]||'').length,suf=m[2]||'',tg=parseFloat(m[1].replace(/,/g,''))||0;
  if(tg<=0)return;const t0=performance.now();
  (function step(t){const p=Math.min(1,(t-t0)/(dur||800)),e=1-Math.pow(1-p,3);tn.nodeValue=(tg*e).toFixed(dec)+suf;if(p<1)requestAnimationFrame(step)})(t0);
 }
 // top stats (อยู่ในจอตอนโหลด) — reward เปิดมาเห็นเลขวิ่งขึ้น
 cu(document.querySelector('#progbar .ps:nth-child(1) .ps-n'));           // ระยะสะสม
 cu(document.querySelector('#progbar .ps:nth-child(2) .ps-n'));           // sessions
 cu(document.querySelector('#progbar .ps:nth-child(3) .ps-n'));           // dc long
 cu(document.querySelector('#progbar .ps:nth-child(4) .ps-n'));           // dc easy/steady
 document.querySelectorAll('#content .snap-card .snap-v').forEach(el=>cu(el)); // streak/longest/cadence

 // ── Tier 1: viz motion (set ค่าว่างทันที = ไม่ flash · คืนค่าจริงตอน scroll ถึง) ──
 // กราฟแท่ง — โตจากล่างทีละแท่ง
 const bars=[...document.querySelectorAll('#content .dist-chart .dc-bar,#content .dist-chart .dc-ghost')];
 bars.forEach(b=>{b.dataset.h=b.style.height;b.style.transition='height .7s '+EASE;b.style.height='0%';});
 if(bars.length)viz('#content .dist-chart',()=>bars.forEach((b,i)=>{b.style.transitionDelay=(i*28)+'ms';b.style.height=b.dataset.h;}));
 // วงแหวนเดือน — กวาด 0 → %
 const ring=document.querySelector('#progbar .prog-month-ring circle:last-of-type');
 if(ring){const off=ring.getAttribute('stroke-dashoffset'),full=ring.getAttribute('stroke-dasharray');
  ring.style.transition='stroke-dashoffset .9s '+EASE;ring.style.strokeDashoffset=full;
  viz('#progbar .prog-month-ring',()=>{ring.style.strokeDashoffset=off;});}
 // เส้น HR — วาดซ้าย→ขวา (draw-on)
 const lines=[...document.querySelectorAll('#content .hr-line')];
 lines.forEach(p=>{const len=p.getTotalLength();p.style.strokeDasharray=len;p.style.strokeDashoffset=len;p.style.transition='stroke-dashoffset 1.1s cubic-bezier(.33,1,.68,1)';});
 if(lines.length)viz('#content .hr-svg-wrap',()=>lines.forEach((p,i)=>{p.style.transitionDelay=(i*180)+'ms';p.style.strokeDashoffset='0';}));
 // bar 4/5 sessions — fill จาก 0
 const pf=document.querySelector('#content .progress-fill');
 if(pf){const w=pf.style.width;pf.style.transition='width .8s '+EASE;pf.style.width='0%';viz('#content .progress',()=>{pf.style.width=w;});}
 // training load bar — fill จาก 0
 const lf=document.querySelector('#content .load-bar .fill');
 if(lf){const w=lf.style.width;lf.style.transition='width .8s '+EASE;lf.style.width='0%';viz('#content .stat .load-bar',()=>{lf.style.width=w;});}

 // ── reveal targets (fade-rise · นำสายตาบนลงล่าง) ──
 ['#races .rl-item','#progbar .prog','.section-l','#content .stat','#content .day'].forEach(sel=>{
  document.querySelectorAll(sel).forEach((el,i)=>{el.classList.add('reveal');el.dataset.d=Math.min(i,7)*45;revealEls.push(el);io.observe(el)});
 });
 // failsafe — observer ไม่ทริกเกอร์ (เช่น โหลดตอน hidden) → บังคับให้ครบ ไม่ค้างว่าง
 setTimeout(()=>{revealEls.forEach(el=>el.classList.add('in'));vizJobs.forEach(fn=>fn());},1800);
}

function exportICS(){
 let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Marathon Sub-4 Plan//TH','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
 const icsYmd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
 const esc=t=>String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,');
 W.forEach((w,wi)=>w.d.forEach(day=>{
  if(day.t==='rest')return;
  const d=dateOf(wi,day.d);
  const d2=new Date(d);d2.setDate(d2.getDate()+1); // all-day event: DTEND เป็น exclusive ตาม RFC 5545
  const cb=CARB[day.ca]||CARB.rest;
  const desc=[day.de,day.al?'Optional: '+day.al:'','Carb: '+cb[0]+'-'+cb[1]+'g'].filter(Boolean).map(esc).join('\\n');
  lines.push('BEGIN:VEVENT','UID:mp-w'+wi+'-d'+day.d+'@training','DTSTART;VALUE=DATE:'+icsYmd(d),'DTEND;VALUE=DATE:'+icsYmd(d2),'SUMMARY:'+esc(day.ti),'DESCRIPTION:'+desc,'CATEGORIES:TRAINING','STATUS:CONFIRMED','END:VEVENT');
 }));
 lines.push('END:VCALENDAR');
 const blob=new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download='Marathon-Sub4-Plan.ics';a.click();
 URL.revokeObjectURL(url);
}

// last sync timestamp (document.lastModified reflects when file was deployed)
(function(){
 const lm=document.lastModified?new Date(document.lastModified):null;
 if(!lm||isNaN(lm))return;
 const diffMin=Math.round((Date.now()-lm)/60000);
 const t=diffMin<60?diffMin+'m':diffMin<1440?Math.floor(diffMin/60)+'h':Math.floor(diffMin/1440)+'d';
 const el=document.querySelector('.hero-kpi');
 if(el){const b=document.createElement('div');b.className='hero-kpi-item';b.innerHTML='<div class="hk-v" style="font-size:16px;letter-spacing:0">'+t+'</div><div class="hk-l">sync ที่แล้ว</div>';el.appendChild(b);}

// pull-to-refresh → hard reload + cache-bust (static dashboard: เห็นข้อมูลล่าสุดที่ deploy ไว้ ไม่ค้าง cache)
(function(){
 const ptr=document.getElementById('ptr'),txt=document.getElementById('ptr-txt');
 const TH=70,MAX=110; // threshold / max pull (px after damping)
 let startY=0,pulling=false,h=0;
 const at=()=>{txt.textContent=h>=TH?'ปล่อยเพื่อรีเฟรช':'ดึงลงเพื่อรีเฟรช';};
 const sheetOpen=()=>document.getElementById('fuel-sheet').classList.contains('on'); // sheet เปิดอยู่ = ห้าม PTR (ลากอ่านในชีทแล้วหน้ารีโหลดทิ้ง)
 addEventListener('touchstart',e=>{
  if(scrollY>0||sheetOpen()||ptr.classList.contains('loading'))return;
  startY=e.touches[0].clientY;pulling=true;h=0;ptr.classList.remove('releasing');
 },{passive:true});
 addEventListener('touchmove',e=>{
  if(!pulling)return;
  if(sheetOpen()){pulling=false;ptr.style.height='0';return;}
  const d=e.touches[0].clientY-startY;
  if(d<=0){pulling=false;ptr.style.height='0';return;}
  e.preventDefault(); // override native overscroll bounce
  h=Math.min(d*0.5,MAX);ptr.style.height=h+'px';at();
 },{passive:false});
 addEventListener('touchend',()=>{
  if(!pulling)return;pulling=false;ptr.classList.add('releasing');
  if(h>=TH){
   ptr.classList.add('loading');ptr.style.height='44px';txt.textContent='กำลังโหลด…';
   const base=location.href.split('?')[0].split('#')[0];
   setTimeout(()=>location.replace(base+'?v='+Date.now()),350);
  }else ptr.style.height='0';
 },{passive:true});
})();
/* ===== hero liquid shader (WebGL fbm domain-warp · danield-style) ===== */
(function(){
 var host=document.querySelector('.hero-fx'); if(!host) return;
 var cv=document.createElement('canvas'); cv.className='hero-gl'; host.appendChild(cv);
 var gl=cv.getContext('webgl')||cv.getContext('experimental-webgl');
 if(!gl){host.classList.add('hero-fx-fallback');return;}
 var vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
 var fs=[
 'precision highp float;','uniform vec2 r;uniform float t;',
 'vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}',
 'vec2 mod289(vec2 x){return x-floor(x*(1./289.))*289.;}',
 'vec3 permute(vec3 x){return mod289(((x*34.)+1.)*x);}',
 'float snoise(vec2 v){const vec4 C=vec4(.211324865,.366025404,-.577350269,.024390243);',
 ' vec2 i=floor(v+dot(v,C.yy));vec2 x0=v-i+dot(i,C.xx);',
 ' vec2 i1=(x0.x>x0.y)?vec2(1.,0.):vec2(0.,1.);vec4 x12=x0.xyxy+C.xxzz;x12.xy-=i1;',
 ' i=mod289(i);vec3 pp=permute(permute(i.y+vec3(0.,i1.y,1.))+i.x+vec3(0.,i1.x,1.));',
 ' vec3 m=max(.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.);m=m*m;m=m*m;',
 ' vec3 x=2.*fract(pp*C.www)-1.;vec3 h=abs(x)-.5;vec3 ox=floor(x+.5);vec3 a0=x-ox;',
 ' m*=1.79284291-.85373472*(a0*a0+h*h);',
 ' vec3 g;g.x=a0.x*x0.x+h.x*x0.y;g.yz=a0.yz*x12.xz+h.yz*x12.yw;return 130.*dot(m,g);}',
 'float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*snoise(p);p*=2.02;a*=.5;}return s;}',
 'void main(){vec2 uv=gl_FragCoord.xy/r;vec2 q=uv;q.x*=r.x/r.y;float tt=t*.04;',
 ' vec2 w=vec2(fbm(q*.85+vec2(0.,tt)),fbm(q*.85+vec2(5.2,-tt)));',
 ' float n=fbm(q*.95+w*1.9+vec2(tt*.6,0.));n=n*.5+.5;',
 ' vec3 c1=vec3(.039,.271,.431),c2=vec3(.078,.549,.745),c3=vec3(.275,.784,.922),c4=vec3(.627,.941,1.0);',
 ' vec3 col=mix(c1,c2,smoothstep(.15,.5,n));col=mix(col,c3,smoothstep(.5,.8,n));',
 ' col=mix(col,c4,smoothstep(.82,1.,n)*.7);col*=1.-.25*length(uv-.5);',
 ' gl_FragColor=vec4(col,1.);}'
 ].join('\n');
 function sh(ty,src){var s=gl.createShader(ty);gl.shaderSource(s,src);gl.compileShader(s);return s;}
 var pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);
 if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){host.classList.add('hero-fx-fallback');cv.remove();return;}
 gl.useProgram(pr);
 var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
 var loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
 var uR=gl.getUniformLocation(pr,'r'),uT=gl.getUniformLocation(pr,'t');
 function size(){var b=host.getBoundingClientRect();var dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.max(1,Math.round(b.width*dpr));cv.height=Math.max(1,Math.round(b.height*dpr));gl.viewport(0,0,cv.width,cv.height);}
 size();
 if(window.ResizeObserver){new ResizeObserver(size).observe(host);}else{window.addEventListener('resize',size);}
 var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,start=performance.now(),vis=true,raf=0;
 function frame(now){var tm=(now-start)/1000;gl.uniform2f(uR,cv.width,cv.height);gl.uniform1f(uT,reduce?0.:tm);gl.drawArrays(gl.TRIANGLES,0,3);raf=(!reduce&&vis)?requestAnimationFrame(frame):0;}
 function kick(){if(!raf&&!reduce&&vis)raf=requestAnimationFrame(frame);}
 if(reduce){requestAnimationFrame(frame);}
 else{if(window.IntersectionObserver){new IntersectionObserver(function(e){vis=e[0].isIntersecting;if(vis)kick();},{threshold:0}).observe(document.getElementById('hero'));}kick();}
})();
/* ===== service worker — เปิดได้ตอนเน็ตหลุด (สนามวิ่ง/เน็ตห่วย) =====
   network-first: เน็ตมี = ของสดเสมอ · เน็ตหลุด = เสิร์ฟ copy ล่าสุด แทนหน้าขาว
   ข้ามตอนเปิดจาก file:// (SW ต้อง http/https) — เปิดไฟล์ในคอมตรงๆ ยังใช้ได้ปกติ */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
 addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
